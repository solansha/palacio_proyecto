<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palacio - Iniciar sesión</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eff6ff, #f8fafc);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 420px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
      padding: 32px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; color: #1d4ed8; }
    p { margin: 0 0 20px; color: #475569; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; margin-bottom: 14px; }
    button {
      width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #2563eb; color: white; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .footer { margin-top: 14px; font-size: 13px; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Palacio de Festivales</h1>
    <p>Accede al sistema para gestionar entradas y ventas.</p>
    <form>
      <label for="usuario">Usuario</label>
      <input id="usuario" type="text" placeholder="Ingrese su usuario" />

      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="Ingrese su contraseña" />

      <button type="button">Iniciar sesión</button>
    </form>
    <div class="footer">Este despliegue usa el backend Node.js puro.</div>
  </div>
</body>
</html>
